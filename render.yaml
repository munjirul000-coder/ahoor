# Ahoor — Render Blueprint
services:
  - type: web
    name: ahoor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: SHOW_CODES
        value: "1"
      - key: ADMIN_EMAIL
        value: "admin@ahoor.com"
