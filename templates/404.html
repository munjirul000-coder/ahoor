<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahoor — পেজ পাওয়া যায়নি</title>
<meta name="theme-color" content="#0A1122">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1430'/%3E%3Cpath d='M16 8.5 9.6 23.5h12.8z' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='8.5' r='2.6' fill='%23fff'/%3E%3Ccircle cx='9.6' cy='23.5' r='2.6' fill='%23fff'/%3E%3Ccircle cx='22.4' cy='23.5' r='2.6' fill='%23FF8A4C'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,__INTER__) format('woff2')}
@font-face{font-family:'Noto Sans Bengali';font-style:normal;font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,__NSB__) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif;
  background:linear-gradient(180deg,#0A1122,#0B1530 60%,#0D1A3E);
  color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 20px;overflow:hidden;position:relative;
}
body::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.4px);
  background-size:32px 32px;
  -webkit-mask-image:radial-gradient(70% 70% at 50% 40%,#000 20%,transparent 100%);
  mask-image:radial-gradient(70% 70% at 50% 40%,#000 20%,transparent 100%);
}
.wrap{position:relative;z-index:1;max-width:520px}
.logo{display:inline-flex;align-items:center;gap:11px;margin-bottom:34px}
.logo b{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}
.logo em{font-style:normal;font-weight:500;color:#8FA3CE}
.code{
  font-size:clamp(4.5rem,16vw,7rem);font-weight:800;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(92deg,#8FB0FF,#5B8CFF 40%,#FF9B66);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-size:clamp(1.3rem,3.6vw,1.7rem);font-weight:800;margin-top:14px;letter-spacing:-.02em}
p{color:#B9C6E3;margin-top:12px;font-size:.98rem;line-height:1.7}
.btns{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:650;font-size:.92rem;
  padding:13px 26px;border-radius:999px;text-decoration:none;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;
}
.btn-p{background:linear-gradient(135deg,#4C84FF,#2F6BFF);color:#fff;box-shadow:0 12px 28px -10px rgba(47,107,255,.55)}
.btn-g{background:rgba(255,255,255,.06);color:#E9EEFB;border:1px solid rgba(255,255,255,.22)}
.btn:hover{transform:translateY(-2px)}
.small{margin-top:26px;font-size:.78rem;color:#7E8FB5}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="url(#lg)"/>
        <path d="M16 8.5 9.6 23.5h12.8z" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="16" cy="8.5" r="2.7" fill="#fff"/><circle cx="9.6" cy="23.5" r="2.7" fill="#fff"/><circle cx="22.4" cy="23.5" r="2.7" fill="#FF8A4C"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#3B77FF"/><stop offset="1" stop-color="#1E4FD8"/></linearGradient></defs>
      </svg>
      <b>Ahoor<em>.</em></b>
    </div>
    <div class="code">404</div>
    <h1>এই পেজটি পাওয়া যায়নি</h1>
    <p>আপনি যে ঠিকানায় যেতে চেয়েছেন, সেটি নেই বা সরিয়ে ফেলা হয়েছে। তবে আপনার ব্যবসার সুযোগ এখনও এক ক্লিক দূরে!</p>
    <div class="btns">
      <a class="btn btn-p" href="/">← হোমে ফিরে যান</a>
      <a class="btn btn-g" href="/opportunities.html">সুযোগ দেখুন</a>
    </div>
    <div class="small">© 2026 Ahoor. All rights reserved.</div>
  </div>
</body>
</html>
