:root{--ink:#0A1122;--bg:#F4F6FA;--text:#101828;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
html[lang="bn"]{--font:'Noto Sans Bengali','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
html[lang="bn"] body{line-height:1.72}
/* ============================================================
   Ahoor — Auth pages shared styles (inline: Fonts come from landing build)
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font,'Inter',system-ui,sans-serif);
  background:var(--bg,#F4F6FA);
  color:var(--text,#101828);
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
::selection{background:#2F6BFF;color:#fff}
:focus-visible{outline:2px solid #2F6BFF;outline-offset:2px;border-radius:8px}

.container{width:100%;max-width:1120px;margin-inline:auto;padding-inline:clamp(18px,4vw,32px)}

/* ---------- auth navbar ---------- */
.auth-nav{position:relative;z-index:50;padding-block:16px}
.auth-nav .container{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:inline-flex;align-items:center;gap:11px;color:var(--ink,#0A1122)}
.brand-name{font-size:1.32rem;font-weight:800;letter-spacing:-.03em}
.brand-name em{font-style:normal;font-weight:500;color:#8FA3CE}
.auth-nav-right{display:flex;align-items:center;gap:14px}
.back-home{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.88rem;font-weight:600;color:#57627A;
  padding:8px 14px;border-radius:999px;border:1px solid #DDE3EE;background:#fff;
  transition:all .25s ease;box-shadow:0 1px 2px rgba(10,17,34,.04);
}
.back-home:hover{color:#2F6BFF;border-color:#C9D8F2;transform:translateY(-1px)}
.back-home .arr{transition:transform .3s var(--ease,.3s)}
.back-home:hover .arr{transform:translateX(-3px)}

/* ---------- lang switch (same as landing) ---------- */
.lang-switch{display:inline-flex;align-items:center;gap:2px;background:#EDF0F7;border:1px solid #DDE3EE;border-radius:999px;padding:3px}
.lang-switch .lang-btn{font-family:inherit;font-size:.8rem;font-weight:650;line-height:1;color:#57627A;padding:6px 12px;border-radius:999px;border:none;background:transparent;transition:background .25s ease,color .25s ease}
.lang-switch .lang-btn:hover{color:#101828}
.lang-switch .lang-btn.on{background:linear-gradient(135deg,#4C84FF,#2F6BFF);color:#fff;box-shadow:0 4px 10px -4px rgba(47,107,255,.6)}
.lang-switch .lsep{color:#A6B1C7;font-size:.72rem;padding:0 2px;user-select:none}

/* ---------- main shell ---------- */
.auth-main{flex:1;display:grid;place-items:center;padding:clamp(20px,4vw,44px) 18px;position:relative}
.auth-main::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(700px 420px at 8% -5%,rgba(47,107,255,.09),transparent 60%),
    radial-gradient(640px 420px at 95% 15%,rgba(255,122,61,.08),transparent 60%);
}
.auth-card{
  width:100%;max-width:480px;
  background:#fff;border:1px solid #E4E9F2;border-radius:24px;
  box-shadow:0 30px 70px -20px rgba(10,17,34,.18),0 4px 12px -6px rgba(10,17,34,.05);
  padding:clamp(26px,4.5vw,42px);
  position:relative;
  animation:cardIn .6s cubic-bezier(.16,1,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.auth-card.wide{max-width:560px}
.auth-head{text-align:center;margin-bottom:26px}
.auth-head .logo-ic{width:52px;height:52px;margin:0 auto 16px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#4C84FF,#2F6BFF);box-shadow:0 12px 26px -10px rgba(47,107,255,.55)}
.auth-head h1{font-size:clamp(1.5rem,3.4vw,1.85rem);font-weight:800;letter-spacing:-.025em;color:#101828;line-height:1.25}
html[lang="bn"] .auth-head h1{line-height:1.35}
.auth-head p{margin-top:8px;color:#57627A;font-size:.95rem}
.auth-head p b{color:#101828}

/* ---------- form fields ---------- */
.field{margin-bottom:17px}
.flabel{display:block;font-size:.8rem;font-weight:650;color:#4A5870;margin-bottom:7px}
.input-wrap{position:relative}
.input-wrap .ficon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8B98B2;pointer-events:none;display:grid}
.input-wrap input{
  width:100%;background:#F6F8FC;border:1px solid #E4E9F2;border-radius:12px;
  padding:14px 44px 14px 42px;font-size:.95rem;color:#101828;font-weight:500;
  transition:border-color .25s ease,box-shadow .25s ease,background .25s;
}
.input-wrap input:hover{border-color:#C9D8F2}
.input-wrap input:focus{outline:none;border-color:#2F6BFF;box-shadow:0 0 0 4px rgba(47,107,255,.12);background:#fff}
.input-wrap input::placeholder{color:#A6B1C7;font-weight:450}
.input-wrap input.err{border-color:#E5484D;background:#FFF7F7}
.input-wrap input.err:focus{box-shadow:0 0 0 4px rgba(229,72,77,.1)}
.pw-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:9px;border:none;background:transparent;
  color:#8B98B2;display:grid;place-items:center;
  transition:background .2s,color .2s;
}
.pw-toggle:hover{background:#EDF0F7;color:#101828}
.field-err{display:none;margin-top:6px;font-size:.78rem;font-weight:550;color:#E5484D}
.field-err.show{display:flex;align-items:center;gap:5px}

/* ---------- form extras row ---------- */
.form-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 20px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:#57627A;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:#2F6BFF;cursor:pointer}
.link-blue{font-size:.85rem;font-weight:650;color:#2F6BFF}
.link-blue:hover{text-decoration:underline}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:inherit;font-size:.95rem;font-weight:650;letter-spacing:-.01em;
  padding:13.5px 26px;border-radius:999px;border:1px solid transparent;
  transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s,background .3s,border-color .3s,opacity .3s;
  white-space:nowrap;line-height:1.3;
}
html[lang="bn"] .btn{white-space:normal}
.btn-block{width:100%}
.btn-primary{background:linear-gradient(135deg,#4C84FF 0%,#2F6BFF 55%,#2358E8 100%);color:#fff;box-shadow:0 12px 28px -10px rgba(47,107,255,.55),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 36px -12px rgba(47,107,255,.6),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary:disabled{opacity:.6;transform:none;cursor:not-allowed;box-shadow:none}
.btn-outline{background:#fff;color:#101828;border-color:#D4DCEA;box-shadow:0 1px 2px rgba(10,17,34,.04)}
.btn-outline:hover{border-color:#2F6BFF;color:#2F6BFF;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#57627A;border-color:transparent}
.btn-ghost:hover{background:#EDF0F7;color:#101828}
.btn-sm{padding:9px 18px;font-size:.85rem}
.spinner{width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.btn.loading .spinner{display:inline-block}
.btn.loading .btn-label{opacity:.85}
.btn.loading{pointer-events:none;opacity:.92}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- messages ---------- */
.msg{display:none;align-items:flex-start;gap:9px;padding:12px 15px;border-radius:12px;font-size:.85rem;font-weight:550;line-height:1.5;margin-bottom:18px}
.msg.show{display:flex;animation:msgIn .35s cubic-bezier(.16,1,.3,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.msg-error{background:#FDECEC;color:#C03221;border:1px solid #F5C6C6}
.msg-success{background:#E6F7F0;color:#0B7A5E;border:1px solid #BDE8D6}
.msg-info{background:#EBF1FF;color:#1E4FD8;border:1px solid #CBD9F8}
.msg .msg-ic{flex-shrink:0;margin-top:1px}

/* ---------- step indicator ---------- */
.steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:26px}
.step-dot{width:8px;height:8px;border-radius:50%;background:#D8DFEC;transition:background .3s,transform .3s}
.step-dot.done{background:#2F6BFF}
.step-dot.on{background:#2F6BFF;transform:scale(1.35);box-shadow:0 0 0 4px rgba(47,107,255,.15)}
.step-sep{width:26px;height:2px;border-radius:2px;background:#D8DFEC}
.step-sep.done{background:#9DBDFF}
.step-label{text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A95AC;margin-bottom:20px}
.step-label b{color:#2A3550}
html[lang="bn"] .step-label{letter-spacing:.02em}

/* ---------- password strength ---------- */
.strength{margin-top:9px}
.strength-bars{display:flex;gap:5px}
.strength-bars i{flex:1;height:4px;border-radius:4px;background:#E7ECF5;transition:background .3s}
.strength-bars i.f{background:#E5484D}
.strength-bars i.g{background:#F0A000}
.strength-bars i.v{background:#0E9F7E}
.strength-label{font-size:.74rem;font-weight:650;color:#8A95AC;margin-top:5px;display:flex;justify-content:space-between}
.strength-label em{font-style:normal;font-weight:700}
.reqs{display:grid;gap:5px;margin-top:10px;padding:12px 14px;background:#F7F9FC;border:1px solid #E8EDF6;border-radius:12px}
.reqs li{display:flex;align-items:center;gap:8px;font-size:.78rem;color:#7C88A0;font-weight:550;transition:color .3s}
.reqs li .ric{width:16px;height:16px;border-radius:50%;border:1.5px solid #C6CFE0;display:grid;place-items:center;flex-shrink:0;transition:all .3s}
.reqs li.ok{color:#0B7A5E}
.reqs li.ok .ric{background:#0E9F7E;border-color:#0E9F7E;color:#fff}

/* ---------- OTP ---------- */
.otp-row{display:flex;gap:9px;justify-content:center;margin:6px 0 18px}
.otp-row input{
  width:46px;height:54px;text-align:center;font-size:1.25rem;font-weight:750;color:#101828;
  background:#F6F8FC;border:1.5px solid #E4E9F2;border-radius:13px;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
.otp-row input:focus{outline:none;border-color:#2F6BFF;box-shadow:0 0 0 4px rgba(47,107,255,.12);background:#fff}
.otp-row input.err{border-color:#E5484D;background:#FFF7F7}
.otp-row input.filled{border-color:#9DBDFF;background:#F2F6FF}
.resend-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.85rem;color:#57627A;margin-bottom:4px}
.resend-row button{border:none;background:none;color:#2F6BFF;font-weight:650;font-size:.85rem;padding:2px 4px}
.resend-row button:disabled{color:#A6B1C7;cursor:not-allowed}
.dev-note{
  display:none;margin:12px 0 16px;padding:12px 14px;border:1.5px dashed #9DBDFF;border-radius:12px;
  background:#F4F8FF;font-size:.8rem;color:#1E4FD8;font-weight:600;text-align:center;line-height:1.6;
}
.dev-note.show{display:block}
.dev-note code{font-weight:800;letter-spacing:.12em;background:#E4EDFF;padding:2px 8px;border-radius:6px;font-family:inherit}

/* ---------- account type cards ---------- */
.type-cards{display:grid;gap:12px;margin-bottom:22px}
.type-card{
  display:flex;align-items:center;gap:16px;text-align:left;
  background:#FBFCFE;border:1.5px solid #E4E9F2;border-radius:16px;
  padding:18px 18px;cursor:pointer;
  transition:border-color .25s,background .25s,transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s;
  position:relative;
}
.type-card:hover{border-color:#C9D8F2;transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,17,34,.15)}
.type-card.sel{border-color:#2F6BFF;background:#F2F6FF;box-shadow:0 0 0 4px rgba(47,107,255,.1)}
.type-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;background:#EBF1FF;color:#2F6BFF;transition:all .3s}
.type-card:nth-child(1) .type-ic{background:#EBF1FF;color:#2F6BFF}
.type-card:nth-child(2) .type-ic{background:#FFF1E7;color:#EA5E1F}
.type-card:nth-child(3) .type-ic{background:#E3F6F0;color:#0E9F7E}
.type-card.sel .type-ic{background:linear-gradient(135deg,#4C84FF,#2F6BFF);color:#fff}
.type-info{flex:1}
.type-info b{display:block;font-size:.98rem;font-weight:750;color:#101828;letter-spacing:-.01em}
.type-info span{display:block;margin-top:3px;font-size:.8rem;color:#57627A;line-height:1.55}
.type-radio{width:22px;height:22px;border-radius:50%;border:2px solid #C6CFE0;flex-shrink:0;display:grid;place-items:center;transition:all .25s}
.type-card.sel .type-radio{border-color:#2F6BFF;background:#2F6BFF}
.type-radio svg{opacity:0;transition:opacity .2s;color:#fff}
.type-card.sel .type-radio svg{opacity:1}

/* ---------- auth footer ---------- */
.auth-foot{padding:26px 0 34px;text-align:center;font-size:.8rem;color:#8A95AC}
.auth-foot .flow{display:inline-flex;align-items:center;gap:7px;font-weight:650;letter-spacing:.06em;color:#A6B1C7;font-size:.68rem}
.auth-foot .flow i{width:3px;height:3px;border-radius:50%;background:#C6CFE0}
html[lang="bn"] .auth-foot .flow{letter-spacing:.01em}

/* ---------- alt link row ---------- */
.alt-row{text-align:center;margin-top:22px;padding-top:20px;border-top:1px solid #EDF0F6;font-size:.9rem;color:#57627A}
.alt-row a{font-weight:700;color:#2F6BFF}
.alt-row a:hover{text-decoration:underline}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);z-index:200;
  display:flex;align-items:center;gap:10px;
  background:rgba(10,17,34,.94);color:#F4F7FF;border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(12px);border-radius:14px;padding:13px 20px;
  font-size:.88rem;font-weight:600;box-shadow:0 20px 44px -12px rgba(8,14,28,.55);
  transition:transform .45s cubic-bezier(.16,1,.3,1);
  max-width:min(92vw,460px);text-align:center;line-height:1.45;
}
.toast.show{transform:translate(-50%,0)}
.toast.ok .tic{color:#34C8A8}
.toast.er .tic{color:#FF7A6B}

/* ---------- dashboard ---------- */
.dash-head{text-align:center;margin-bottom:28px}
.dash-head .avatar{
  width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4C84FF,#2F6BFF);color:#fff;font-size:1.5rem;font-weight:800;
  box-shadow:0 14px 30px -10px rgba(47,107,255,.5);
}
.dash-head h1{font-size:clamp(1.35rem,3.2vw,1.7rem);font-weight:800;letter-spacing:-.025em;color:#101828}
.dash-head p{margin-top:6px;color:#57627A;font-size:.92rem}
.chip-type{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:.72rem;font-weight:700;color:#1E4FD8;background:#EBF1FF;border:1px solid #CBD9F8;padding:5px 12px;border-radius:999px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.dash-card{
  display:flex;flex-direction:column;gap:10px;
  background:#FBFCFE;border:1.5px solid #E4E9F2;border-radius:16px;padding:20px;
  transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s,border-color .3s;
  cursor:pointer;position:relative;overflow:hidden;
}
.dash-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px -16px rgba(10,17,34,.18);border-color:#C9D8F2}
.dash-card .dico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#EBF1FF;color:#2F6BFF}
.dash-card:nth-child(2) .dico{background:#FFF1E7;color:#EA5E1F}
.dash-card:nth-child(3) .dico{background:#E3F6F0;color:#0E9F7E}
.dash-card:nth-child(4) .dico{background:#EDEAFF;color:#6D4FDB}
.dash-card b{font-size:.95rem;font-weight:750;color:#101828}
.dash-card span{font-size:.78rem;color:#57627A;line-height:1.5}
.soon-tag{
  position:absolute;top:14px;right:14px;font-size:.6rem;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:#8A95AC;background:#F0F3F9;border:1px solid #E2E8F2;padding:3px 8px;border-radius:999px;
}
.dash-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

/* ---------- success (profile setup) ---------- */
.success-ic{
  width:76px;height:76px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;
  background:linear-gradient(135deg,#34C8A8,#0E9F7E);color:#fff;
  box-shadow:0 18px 40px -14px rgba(14,159,126,.55);
  animation:popIn .6s cubic-bezier(.16,1,.3,1);
}
@keyframes popIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.check-pulse{animation:cpulse 2.4s ease-out infinite}
@keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(14,159,126,.35)}70%{box-shadow:0 0 0 22px rgba(14,159,126,0)}100%{box-shadow:0 0 0 0 rgba(14,159,126,0)}}

/* ---------- responsive ---------- */
@media (max-width:520px){
  .back-home span{display:none}
  .back-home{padding:9px 12px}
  .auth-card{padding:26px 20px;border-radius:20px}
  .dash-grid{grid-template-columns:1fr}
  .otp-row input{width:42px;height:50px}
}
@media (max-width:360px){
  .otp-row{gap:6px}
  .otp-row input{width:38px;height:48px;font-size:1.1rem}
  .brand-name{font-size:1.15rem}
}

/* ============ Marketplace + posts ============ */
select,textarea{font-family:inherit;font-size:.95rem;color:#101828;width:100%;background:#F6F8FC;border:1px solid #E4E9F2;border-radius:12px;padding:13px 14px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
select:focus,textarea:focus{border-color:#2F6BFF;box-shadow:0 0 0 4px rgba(47,107,255,.12);background:#fff}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.select-wrap{position:relative}
.select-wrap::after{content:'';position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid #8B98B2;border-bottom:2px solid #8B98B2;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select-wrap select{appearance:none;-webkit-appearance:none;padding-right:36px}

/* marketplace header */
.mp-head{background:#fff;border-bottom:1px solid #E4E9F2;padding:26px 0 20px}
.mp-head h1{font-size:clamp(1.4rem,3.2vw,1.8rem);font-weight:800;letter-spacing:-.025em;color:#101828;text-align:center}
.mp-head p{text-align:center;color:#57627A;font-size:.9rem;margin-top:6px}
.mp-controls{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-top:18px}
.mp-controls .btn{white-space:nowrap}
@media(max-width:860px){.mp-controls{grid-template-columns:1fr 1fr}.mp-controls .btn{grid-column:1/-1}}
@media(max-width:520px){.mp-controls{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.tab{font-family:inherit;font-size:.88rem;font-weight:650;color:#57627A;background:#fff;border:1.5px solid #E4E9F2;border-radius:999px;padding:9px 20px;cursor:pointer;transition:all .25s}
.tab:hover{border-color:#C9D8F2;color:#101828}
.tab.on{background:linear-gradient(135deg,#4C84FF,#2F6BFF);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px rgba(47,107,255,.5)}
.mp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:26px 0 10px}
@media(max-width:480px){.mp-grid{grid-template-columns:1fr}}
.post-card{background:#fff;border:1px solid #E4E9F2;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:11px;box-shadow:0 4px 16px -10px rgba(10,17,34,.08);transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s,border-color .3s;position:relative;overflow:hidden}
.post-card:hover{transform:translateY(-4px);box-shadow:0 18px 36px -18px rgba(10,17,34,.2);border-color:#C9D8F2}
.post-img{width:100%;height:170px;object-fit:cover;border-radius:12px;background:#F0F3F9}
.post-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.post-badge{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid}
.post-badge.buyer{color:#1E4FD8;background:#EBF1FF;border-color:#CBD9F8}
.post-badge.supplier{color:#B45309;background:#FFF1E7;border-color:#FFD7B8}
.post-status{font-size:.66rem;font-weight:700;padding:4px 10px;border-radius:999px}
.post-status.open{color:#0B7A5E;background:#E6F7F0}
.post-status.closed{color:#8A95AC;background:#F0F3F9}
.post-card h3{font-size:1.06rem;font-weight:750;letter-spacing:-.015em;line-height:1.35;color:#101828}
.post-meta{display:flex;flex-wrap:wrap;gap:7px 14px;font-size:.78rem;color:#57627A;font-weight:550}
.post-meta b{color:#101828;font-weight:700}
.post-desc{font-size:.84rem;color:#57627A;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-owner{display:flex;align-items:center;gap:9px;margin-top:2px}
.po-av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#4C84FF,#2F6BFF);flex-shrink:0;overflow:hidden}
.po-av img{width:100%;height:100%;object-fit:cover}
.po-info{font-size:.76rem;color:#8A95AC;line-height:1.35;min-width:0}
.po-info b{display:block;font-size:.82rem;color:#2A3550;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-card .btn{margin-top:auto}
.mp-empty{text-align:center;padding:50px 16px;color:#8A95AC;font-size:.92rem;grid-column:1/-1}
/* marketplace state machine: loading / empty / error — only one visible at a time */
.mp-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:56px 16px;color:#8A95AC;font-size:.92rem;grid-column:1/-1}
.mp-spinner{width:22px;height:22px;border:3px solid #E4E9F2;border-top-color:#2F6BFF;border-radius:50%;animation:mp-spin .8s linear infinite}
@keyframes mp-spin{to{transform:rotate(360deg)}}
.mp-empty-state{text-align:center;padding:44px 16px;color:#8A95AC;font-size:.92rem;grid-column:1/-1}
.mp-empty-ic{font-size:2rem;display:block;margin-bottom:10px}
.mp-empty-state h3{font-size:1.05rem;font-weight:750;color:#101828;margin-bottom:6px}
.mp-empty-state p{color:#8A95AC;margin-bottom:16px}
.mp-empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mp-empty-login{margin-top:10px;font-size:.8rem;color:#A6B1C7}
.mp-err{text-align:center;padding:44px 16px;color:#B42318;grid-column:1/-1}
.mp-err p{margin-bottom:16px;font-size:.92rem}
/* nav link rows (marketplace + suppliers/opportunities listing pages) collapse on mobile */
@media(max-width:700px){.mp-navlinks{display:none!important}}
/* footer link rows on auth/marketplace pages */
.auth-foot .flinks{display:flex;justify-content:center;gap:18px;margin-top:10px;flex-wrap:wrap}
.auth-foot .flinks a{color:#8A95AC;text-decoration:none;font-size:.8rem;transition:color .15s}
.auth-foot .flinks a:hover{color:#2F6BFF}
/* static info pages (about / contact / privacy / terms) */
.info-card{max-width:780px;margin:0 auto;padding:34px 30px}
.info-card h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:#101828;margin-bottom:6px}
.info-card .lead{color:#57627A;font-size:.95rem;margin-bottom:8px}
.info-card .updated{font-size:.78rem;color:#8A95AC;margin:0 0 18px}
.info-card h2{font-size:1.05rem;font-weight:750;color:#101828;margin:22px 0 8px}
.info-card p,.info-card li{color:#475069;font-size:.9rem;line-height:1.65}
.info-card ul{margin:6px 0 12px 18px}
.info-card a{color:#2F6BFF}
/* compact listing pages (suppliers / opportunities) */
.li-wrap{max-width:880px;margin:0 auto;padding:28px 16px 60px}
.li-wrap>h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;color:#101828}
.li-wrap>.li-sub{color:#57627A;font-size:.92rem;margin:6px 0 22px}
.li-item{background:#fff;border:1px solid #E4E9F2;border-radius:14px;padding:15px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;text-decoration:none;transition:box-shadow .15s,border-color .15s}
.li-item:hover{border-color:#C9D6F5;box-shadow:0 6px 18px -10px rgba(47,107,255,.35)}
.li-item h3{margin:0 0 4px;font-size:.96rem;font-weight:700;color:#101828}
.li-item p{font-size:.84rem;color:#57627A;margin:0}
.li-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:.78rem;color:#8A95AC}
.li-go{color:#2F6BFF;font-size:1.1rem;margin-top:2px}
.li-empty{text-align:center;padding:40px 16px;color:#8A95AC}
.li-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}

/* quote modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,17,34,.55);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.on{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:460px;width:100%;padding:26px;box-shadow:0 40px 90px -30px rgba(10,17,34,.5);animation:cardIn .4s cubic-bezier(.16,1,.3,1)}
.modal h3{font-size:1.1rem;font-weight:750;color:#101828;margin-bottom:4px}
.modal p.sub{font-size:.82rem;color:#8A95AC;margin-bottom:16px}
.modal .field{margin-bottom:12px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}

/* dashboard lists */
.dash-list{display:grid;gap:12px;margin-bottom:26px}

.chat-send .spinner{width:16px;height:16px;border:2.2px solid rgba(255,255,255,.35);border-top-color:#fff}
.chat-placeholder{flex:1;display:grid;place-items:center;text-align:center;padding:30px;color:#8A95AC}

 "about.title":["About Ahoor","Ahoor সম্পর্কে"],
 "about.lead":["A B2B marketplace and opportunity network built for Bangladesh.","বাংলাদেশের জন্য তৈরি একটি B2B মার্কেটপ্লেস ও ব্যবসার সুযোগের নেটওয়ার্ক।"],
 "about.h1":["Who we are","আমরা কারা"],
 "about.p1":["Ahoor helps Bangladeshi businesses find each other. Buyers post what they need; suppliers and manufacturers post what they offer. Our smart matching surfaces the right opportunities to the right businesses — without endless searching.","Ahoor বাংলাদেশি ব্যবসাগুলোকে একে অপরকে খুঁজে পেতে সাহায্য করে। ক্রেতারা যা প্রয়োজন তা পোস্ট করেন; সরবরাহকারী ও প্রস্তুতকারকেরা যা অফার করেন তা পোস্ট করেন। আমাদের স্মার্ট ম্যাচিং সঠিক সুযোগগুলো সঠিক ব্যবসার কাছে পৌঁছে দেয় — অন্তহীন খোঁজাখুঁজি ছাড়াই।"],
 "about.h2":["What we do","আমরা যা করি"],
 "about.p2":["Businesses on Ahoor can post requirements and offers, receive and compare quotations, chat directly with potential partners, get matched with relevant opportunities, and track their performance through business analytics.","Ahoor-এ ব্যবসাগুলো প্রয়োজন ও অফার পোস্ট করতে পারে, কোটেশন পেতে ও তুলনা করতে পারে, সম্ভাব্য অংশীদারদের সাথে সরাসরি চ্যাট করতে পারে, উপযুক্ত সুযোগের সাথে ম্যাচ হতে পারে এবং বিজনেস অ্যানালিটিক্সের মাধ্যমে নিজেদের পারফরম্যান্স দেখতে পারে।"],
 "about.h3":["Who it's for","কাদের জন্য"],
 "about.p3":["Ahoor is for manufacturers, suppliers, wholesalers, exporters, importers, and bulk buyers across Bangladesh — from textiles and garments to agro products, jute, leather, packaging, and more.","Ahoor বাংলাদেশের প্রস্তুতকারক, সরবরাহকারী, পাইকারি বিক্রেতা, রপ্তানিকারক, আমদানিকারক ও পাইকারি ক্রেতাদের জন্য — টেক্সটাইল ও গার্মেন্টস থেকে শুরু করে কৃষি পণ্য, পাট, চামড়া, প্যাকেজিংসহ আরও অনেক খাতে।"],
 "about.h4":["Contact us","যোগাযোগ করুন"],
 "about.p4":["Questions or feedback? Reach us through the contact page — or sign in and use in-app messaging to talk to any business on the platform.","প্রশ্ন বা মতামত আছে? যোগাযোগ পৃষ্ঠার মাধ্যমে আমাদের জানান — অথবা সাইন ইন করে প্ল্যাটফর্মের যেকোনো ব্যবসার সাথে ইন-অ্যাপ মেসেজিংয়ে কথা বলুন।"],

 "contact.p2":["See something wrong on the platform — a suspicious post, an unfair quotation, or a bug? Sign in and use the Report option on any post or business profile.","প্ল্যাটফর্মে কিছু ভুল দেখলে — সন্দেহজনক পোস্ট, অসাধু কোটেশন বা কোনো ত্রুটি? সাইন ইন করে যেকোনো পোস্ট বা বিজনেস প্রোফাইলে রিপোর্ট অপশন ব্যবহার করুন।"],

 "privacy.title":["Privacy Policy","গোপনীয়তা নীতি"],
 "privacy.updated":["Last updated: August 2026","সর্বশেষ হালনাগাদ: আগস্ট ২০২৬"],
 "privacy.lead":["This policy explains what information Ahoor collects and how we use it.","এই নীতিতে বলা হয়েছে Ahoor কী তথ্য সংগ্রহ করে এবং সেগুলো কীভাবে ব্যবহার করে।"],
 "privacy.h1":["Information we collect","আমরা যা সংগ্রহ করি"],
 "privacy.p1":["When you create an account we collect your name, email, phone number, and the business information you choose to add (business name, category, location, products, and similar details). We also store the posts, quotations, messages, and reports you create, plus basic usage events such as profile and post views.","অ্যাকাউন্ট তৈরি করার সময় আমরা আপনার নাম, ইমেইল, ফোন নম্বর এবং আপনি যে ব্যবসায়িক তথ্য যোগ করেন (ব্যবসার নাম, ক্যাটাগরি, অবস্থান, পণ্য ইত্যাদি) সংগ্রহ করি। আপনার তৈরি পোস্ট, কোটেশন, মেসেজ ও রিপোর্ট এবং প্রোফাইল/পোস্ট ভিউয়ের মতো মৌলিক ব্যবহারের তথ্যও আমরা সংরক্ষণ করি।"],
 "privacy.h2":["How we use it","কীভাবে ব্যবহার করি"],
 "privacy.p2":["Your information is used to run the platform: connecting you with relevant businesses, showing your posts and profile to other members, sending notifications and quotations, matching opportunities, and showing you your own analytics. We never invent or publish fake business data.","আপনার তথ্য প্ল্যাটফর্ম চালাতে ব্যবহৃত হয়: উপযুক্ত ব্যবসার সাথে যুক্ত করা, আপনার পোস্ট ও প্রোফাইল অন্য সদস্যদের দেখানো, নোটিফিকেশন ও কোটেশন পাঠানো, সুযোগ ম্যাচ করা এবং আপনার নিজের অ্যানালিটিক্স দেখানো। আমরা কখনো ভুয়া ব্যবসার তথ্য তৈরি করি না বা প্রকাশ করি না।"],
 "privacy.h3":["What we don't share","যা আমরা শেয়ার করি না"],
 "privacy.p3":["We do not sell your personal data. Your phone number and email are only visible to other members according to your own visibility settings. We never expose passwords, session tokens, or private analytics of other businesses.","আমরা আপনার ব্যক্তিগত তথ্য বিক্রি করি না। আপনার ফোন নম্বর ও ইমেইল শুধুমাত্র আপনার ভিজিবিলিটি সেটিংস অনুযায়ী অন্য সদস্যদের কাছে দৃশ্যমান হয়। আমরা কখনো পাসওয়ার্ড, সেশন টোকেন বা অন্য ব্যবসার ব্যক্তিগত অ্যানালিটিক্স প্রকাশ করি না।"],
 "privacy.h4":["Security","নিরাপত্তা"],
 "privacy.p4":["Passwords are stored as salted hashes, sessions use secure random tokens, and all account pages require login. As with any online service, please use a strong, unique password.","পাসওয়ার্ড সল্টেড হ্যাশ হিসেবে সংরক্ষিত থাকে, সেশনে সিকিউর র্যান্ডম টোকেন ব্যবহৃত হয় এবং সব অ্যাকাউন্ট পৃষ্ঠায় লগইন আবশ্যক। যেকোনো অনলাইন সেবার মতো, দয়া করে শক্তিশালী ও আলাদা পাসওয়ার্ড ব্যবহার করুন।"],
 "privacy.h5":["Your choices","আপনার পছন্দ"],
 "privacy.p5":["You can edit or remove your business information from your profile anytime. To close your account or ask questions about your data, contact us from the contact page.","আপনার প্রোফাইল থেকে যেকোনো সময় ব্যবসায়িক তথ্য সম্পাদনা বা মুছে ফেলতে পারেন। অ্যাকাউন্ট বন্ধ করতে বা আপনার ডেটা নিয়ে প্রশ্ন থাকলে যোগাযোগ পৃষ্ঠা থেকে আমাদের জানান।"],

var LANG = (function(){
  try{ var s = localStorage.getItem('ahoor-lang'); if(s==='en'||s==='bn') return s; }catch(e){}
  return 'bn';
})();

function t(key, params){
  var v = D[key];
  if(!v) return key;
  var s = v[LANG==='bn'?1:0];
  if(params){ for(var k in params){ s = s.replace('{'+k+'}', params[k]); } }
  return s;
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var v = D[el.getAttribute('data-i18n')];
    if(v) el.textContent = v[LANG==='bn'?1:0];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
    var v = D[el.getAttribute('data-i18n-ph')];
    if(v) el.setAttribute('placeholder', v[LANG==='bn'?1:0]);
  });
  document.querySelectorAll('.lang-btn').forEach(function(b){
    var on = b.getAttribute('data-lang')===LANG;
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed', on?'true':'false');
  });
  var metaKey = document.body.getAttribute('data-meta');
  if(metaKey && D[metaKey]) document.title = D[metaKey][LANG==='bn'?1:0];
  document.dispatchEvent(new CustomEvent('langchange'));
}
function setLang(l){
  LANG = l;
  try{ localStorage.setItem('ahoor-lang', l); }catch(e){}
  applyLang();
}
document.querySelectorAll('.lang-btn').forEach(function(b){
  b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
});
window.__t = t;

function api(path, body){
  var opts = { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin' };
  if(body) opts.body = JSON.stringify(body);
  var ctrl = null;
  if(typeof AbortController !== 'undefined'){
    ctrl = new AbortController();
    opts.signal = ctrl.signal;
    setTimeout(function(){ ctrl.abort(); }, 15000);
  }
  return fetch(path, opts).then(function(r){
    var ct = r.headers.get('content-type') || '';
    if(ct.indexOf('application/json') === -1){

}

/* validators */
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim()); }
function validPhone(v){
  var d = String(v||'').replace(/[^\d+]/g,'');

function pwScore(pw){
  var s=0;
  if(pw.length>=8) s++;
  if(pw.length>=12) s++;
  if(/[A-Za-z]/.test(pw) && /\d/.test(pw)) s++;
  if(/[^A-Za-z0-9]/.test(pw)) s++;
  return s;
}

/* password strength meter + requirements */
function initStrength(input, barsEl, labelEl){
  function update(){
    var v = input.value;
    var s = pwScore(v);
    if(!v){ barsEl.querySelectorAll('i').forEach(function(i){ i.className=''; }); labelEl.querySelector('em').textContent=''; return; }
    var active = v.length>=8 ? Math.max(1, s) : 0;
    var colors = ['f','f','g','g','v'];
    barsEl.querySelectorAll('i').forEach(function(i, idx){
      i.className = idx < active ? colors[active-1] : '';
    });
    labelEl.querySelector('em').textContent = t('su.st'+active);
    labelEl.querySelector('em').style.color = active>=4 ? '#0E9F7E' : active>=2 ? '#F0A000' : '#E5484D';
    /* requirements */
    var reqs = input.getAttribute('data-reqs');
    if(reqs){
      var r1 = $('[data-req="len"]'), r2 = $('[data-req="mix"]');
      if(r1) r1.classList.toggle('ok', v.length>=8);
      if(r2) r2.classList.toggle('ok', /[A-Za-z]/.test(v) && /\d/.test(v));
    }
  }
  input.addEventListener('input', update);
  return update;
}

/* OTP inputs */
function initOtp(inputs, onComplete){
  inputs.forEach(function(inp, i){
    inp.setAttribute('inputmode','numeric');
    inp.setAttribute('maxlength','1');
    inp.addEventListener('input', function(){
      var v = inp.value.replace(/[^0-9]/g,'').slice(0,1);
      inp.value = v;
      if(v){ inp.classList.add('filled'); if(i < inputs.length-1) inputs[i+1].focus(); }
      var full = inputs.every(function(x){ return x.value; });
      if(full && onComplete) onComplete(inputs.map(function(x){ return x.value; }).join(''));
    });
    inp.addEventListener('keydown', function(e){
      if(e.key==='Backspace' && !inp.value && i>0){ inputs[i-1].focus(); inputs[i-1].value=''; inputs[i-1].classList.remove('filled'); }
    });
    inp.addEventListener('paste', function(e){
      e.preventDefault();
      var txt = (e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'').slice(0, inputs.length);
      inputs.forEach(function(x, j){ x.value = txt[j]||''; x.classList.toggle('filled', !!txt[j]); });
      var full = inputs.every(function(x){ return x.value; });
      if(full && onComplete) onComplete(txt);
      else inputs[Math.min(txt.length, inputs.length-1)].focus();
    });
  });
}

      btn.textContent = t('su.resend');
    } else {

    }
  }, 1000);
}

/* ---------- shared notification helpers ---------- */
function nTimeAgo(iso){
  var diff = (Date.now() - new Date(iso).getTime()) / 60000;
  if (diff < 1) return t('ms.justNow');
  if (diff < 60) return t('ms.minAgo').replace('{m}', Math.floor(diff));
  if (diff < 1440) return t('ms.hrAgo').replace('{h}', Math.floor(diff / 60));
  return t('ms.dayAgo').replace('{d}', Math.floor(diff / 1440));
}
function notifTitle(n){
  if (!n || !n.type) return '';
  return t('nt.' + n.type).replace('{name}', n.data && (n.data.senderName || n.data.actorName) || '');
}
function notifDesc(n){
  if (!n || !n.data) return '';
  if (n.data.postTitle) return n.data.postTitle;
  if (n.data.preview) return n.data.preview;
  if (n.type === 'message_received' && !n.data.preview) return t('nt.photo');
  return '';
}
function notifLink(n){
  if (!n) return '/dashboard.html';
  switch (n.type) {
    case 'quote_received':
    case 'request_received': return '/dashboard.html#quotesSec';
    case 'quote_accepted':
    case 'quote_rejected': return '/dashboard.html#sentSec';
    case 'message_received': return '/messages.html?conv=' + (n.data && n.data.conversationId ? n.data.conversationId : '');
    case 'opportunity_match': return '/matches.html';
    case 'verification_submitted':
    case 'verification_approved':
    case 'verification_rejected': return '/verify.html';
    default: return '/dashboard.html';
  }
}
function notifIcon(n){
  if (!n || !n.type) return '📩';
  if (n.type === 'verification_approved') return '✅';
  if (n.type === 'verification_rejected') return '❌';
  if (n.type === 'verification_submitted') return '🛡️';
  if (n.type === 'opportunity_match') return '🔥';
  if (n.type.indexOf('accepted') >= 0) return '✅';
  if (n.type.indexOf('rejected') >= 0) return '❌';
  if (n.type === 'message_received') return '💬';
  if (n.type === 'request_received') return '📩';
  return '📩';
}
function onNotif(cb){
  if (typeof EventSource === 'undefined') return;
  try {
    var es = new EventSource('/api/stream');
    es.onmessage = function(ev){
      try { var d = JSON.parse(ev.data); if (d.type === 'notification') cb(d); } catch(e){}
    };
  } catch(e){}
}

            location.href = notifLink(n);
          });
          list.appendChild(el);
        });
      })

  bell.addEventListener('click', function(e){

/* ---- accessible modal helpers: focus trap + ESC + inert while hidden ---- */
function modalFocusable(el){
  return Array.prototype.slice.call(el.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
    .filter(function(x){ return x.offsetParent !== null; });
}
function openModal(el, focusSel){
  if(!el || el.__ahoorOpen) return;
  el.__ahoorOpen = true;
  el.__ahoorLast = document.activeElement;
  el.removeAttribute('inert');
  el.setAttribute('aria-hidden', 'false');
  el.classList.add('on');
  var f = focusSel ? el.querySelector(focusSel) : null;
  if(!f || f.offsetParent === null){ var fb = modalFocusable(el); f = fb[0] || null; }
  if(f && f.focus) f.focus();
  function onKey(e){
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(el); return; }
    if(e.key !== 'Tab') return;
    var items = modalFocusable(el);
    if(!items.length) return;
    var first = items[0], last = items[items.length - 1];
    var idx = items.indexOf(document.activeElement);
    if(e.shiftKey){ if(idx <= 0){ e.preventDefault(); last.focus(); } }
    else if(idx === -1 || idx === items.length - 1){ e.preventDefault(); first.focus(); }
  }
  el.__ahoorKey = onKey;
  document.addEventListener('keydown', onKey, true);
}
function closeModal(el){
  if(!el || !el.__ahoorOpen) return;
  el.__ahoorOpen = false;
  if(el.__ahoorKey){ document.removeEventListener('keydown', el.__ahoorKey, true); el.__ahoorKey = null; }
  el.classList.remove('on');
  el.setAttribute('aria-hidden', 'true');
  el.setAttribute('inert', '');
  var last = el.__ahoorLast; el.__ahoorLast = null;
  if(last && last.focus) try{ last.focus(); }catch(e){}
}
/* show/hide a flow step: display + hidden/inert so inactive steps stay unfocusable */
function setStep(el, on){
  if(!el) return;
  if(on){ el.style.display = ''; el.removeAttribute('hidden'); el.removeAttribute('inert'); }
  else { el.style.display = 'none'; el.setAttribute('hidden', ''); el.setAttribute('inert', ''); }
}

    var desc = document.getElementById('ptDesc').value.trim();
    var ok = true;
    var firstBad = null;
    function bad(id, key){
      var el = document.getElementById(id);
      A.fieldErr(el, key);
      if(!firstBad) firstBad = el;
      ok = false;
    }
    if(title.length < 4) bad('ptTitleF', 'pt.errTitle');
    if(!cat) bad('ptCat', 'pt.errCat');
    if(!loc) bad('ptLoc', 'pt.errLoc');
    if(desc.length < 10) bad('ptDesc', 'pt.errDesc');
    if(!ok){
      // show a big, unmissable summary + scroll to first invalid field
      var msgEl = document.getElementById('ptMsg');
      var missing = [];
      if(title.length < 4) missing.push(A.t('pt.title'));
      if(!cat) missing.push(A.t('pt.category'));
      if(!loc) missing.push(A.t('pt.location'));
      if(desc.length < 10) missing.push(A.t('pt.desc'));
      A.showMsg(msgEl, 'error', A.t('pp.required') + ' ' + missing.join(', '));
      if(firstBad) firstBad.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    var body = {
      type: kind,
      title: title,
      category: cat,
      qty: document.getElementById('ptQty').value.trim(),
      unit: document.getElementById('ptUnit').value,
      budget: kind === 'buyer' ? document.getElementById('ptBudget').value.trim() : '',
      moq: kind === 'supplier' ? document.getElementById('ptMoq').value.trim() : '',
      price: kind === 'supplier' ? document.getElementById('ptPrice').value.trim() : '',
      location: loc,
      deadline: kind === 'buyer' ? document.getElementById('ptDeadline').value : '',
      desc: desc,
      image: imgData
    };
    var btn = document.getElementById('ptSubmit');
    A.setLoading(btn, true, editId ? 'pt.savingE' : 'pt.publishing');
    var req = editId
      ? A.api('/api/posts/' + editId + '/edit', body)
      : A.api('/api/posts', body);
    req.then(function(r){
      A.setLoading(btn, false);
      if(r.status === 201 || r.status === 200){
        A.toast(A.t(editId ? 'pt.updated' : 'pt.published'), 'ok');
        setTimeout(function(){ location.href = '/dashboard.html'; }, 900);
      } else if(r.status === 401){
        location.href = '/login.html?next=/post.html';
      } else {
        A.showMsg(document.getElementById('ptMsg'), 'error', A.errMsg(r.data.error));
      }
    });
  });
})();
</script>
</body>
</html>
